[metadata]
name = common-goldencedar
version = 0.1
author = Golden Cedar
author_email = 26373564-goldencedar@users.noreply.gitlab.com
description = Common utilities for all Python applications
long_description = file: README.md
long_description_content_type = text/markdown
url = https://gitlab.com/goldencedar/python-pip-common
project_urls =
    Bug Tracker = https://gitlab.com/goldencedar/python-pip-common/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: GNU General Public License v3 (GPLv3)
    Operating System :: POSIX :: Linux

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.7
install_requires =
    aiodebug>=1.1.2
    pudb>=2020.1
    requests>=2.26.0
    retrying>=1.3.3
    uvloop>=0.15.2

[options.packages.find]
where = src
